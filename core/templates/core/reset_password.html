{% extends "base.html" %}

{% block title %}Reset Password - {{ target_user.username }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
  <h1>🔑 Reset Password for {{ target_user.username }}</h1>
  <p style="color: #6b7280;">Role: {{ target_user.get_role_display }}</p>
  
  <form method="post" style="margin-top: 24px;">
    {% csrf_token %}
    
    <div style="margin-bottom: 16px;">
      <label for="new_password">New Password</label>
      <input type="password" id="new_password" name="new_password" required minlength="8" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px;">
      <small style="color: #6b7280; margin-top: 4px; display: block;">Minimum 8 characters</small>
    </div>
    
    <div style="margin-bottom: 24px;">
      <label for="confirm_password">Confirm New Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px;">
    </div>
    
    <div style="display: flex; gap: 12px;">
      <button type="submit" style="flex: 1;">Reset Password</button>
      <a href="{% url 'staff_management' %}" style="flex: 1; text-align: center; background: #e5e7eb; color: #374151; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: 600;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
