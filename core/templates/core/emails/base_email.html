<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SubManager{% endblock %}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      color: #1f2937;
    }
    .email-wrapper {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
    }
    .email-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      padding: 30px 24px;
      text-align: center;
    }
    .email-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .email-header p {
      margin: 8px 0 0 0;
      opacity: 0.9;
      font-size: 14px;
    }
    .email-body {
      padding: 32px 24px;
    }
    .email-body h2 {
      color: #1f2937;
      margin: 0 0 16px 0;
      font-size: 20px;
    }
    .email-body p {
      margin: 0 0 16px 0;
      line-height: 1.6;
      color: #4b5563;
      font-size: 15px;
    }
    .info-box {
      background: #f9fafb;
      border-left: 4px solid #667eea;
      padding: 16px;
      border-radius: 6px;
      margin: 20px 0;
    }
    .info-box strong {
      color: #1f2937;
    }
    .qr-container {
      text-align: center;
      padding: 24px;
      background: #f9fafb;
      border-radius: 12px;
      margin: 24px 0;
    }
    .qr-container img {
      max-width: 250px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
    }
    .qr-caption {
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff !important;
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      margin: 8px 0;
    }
    .btn-warning {
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
    }
    .btn-center {
      text-align: center;
      margin: 24px 0;
    }
    .pin-box {
      text-align: center;
      background: #eff6ff;
      border: 2px dashed #3b82f6;
      padding: 24px;
      border-radius: 12px;
      margin: 24px 0;
    }
    .pin-code {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #1e40af;
      font-family: 'Courier New', monospace;
      margin: 12px 0;
    }
    .footer {
      background: #f9fafb;
      padding: 20px 24px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
    }
    .footer a {
      color: #667eea;
      text-decoration: none;
    }
    .warning-box {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      padding: 16px;
      border-radius: 6px;
      margin: 20px 0;
      color: #92400e;
    }
    .urgent-box {
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      padding: 16px;
      border-radius: 6px;
      margin: 20px 0;
      color: #991b1b;
    }
    .success-box {
      background: #dcfce7;
      border-left: 4px solid #16a34a;
      padding: 16px;
      border-radius: 6px;
      margin: 20px 0;
      color: #166534;
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-header">
      <h1>📋 SubManager</h1>
      <p>Your Equipment Subscription Service</p>
    </div>
    
    <div class="email-body">
      {% block content %}{% endblock %}
    </div>
    
    <div class="footer">
      <p>This email was sent by SubManager. If you have questions, please contact our support team.</p>
      <p>&copy; {% now "Y" %} SubManager. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
