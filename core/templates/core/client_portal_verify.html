<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify PIN - Client Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .portal-card {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 500px;
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #1f2937;
    }
    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 8px;
      font-weight: 700;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .messages {
      margin-bottom: 20px;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: #667eea;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="portal-card">
    <h1>🔑 Verify PIN</h1>
    <p class="subtitle">Enter the 6-digit code sent to your WhatsApp</p>
    
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
      <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    
    <form method="post">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="pin_code">Verification Code</label>
        <input type="text" id="pin_code" name="pin_code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
      </div>
      
      <button type="submit">Verify & Access Dashboard</button>
    </form>
    
    <div class="back-link">
      <a href="{% url 'client_portal' %}">← Back to start</a>
    </div>
  </div>
</body>
</html>
